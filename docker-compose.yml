services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: unisell-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-unisell}
      DB_USERNAME: ${DB_USERNAME:-unisell}
      DB_PASSWORD: ${DB_PASSWORD:-unisell_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unisell

  queue:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: unisell-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-unisell}
      DB_USERNAME: ${DB_USERNAME:-unisell}
      DB_PASSWORD: ${DB_PASSWORD:-unisell_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unisell

  mysql:
    image: mysql:8.0
    container_name: unisell-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-unisell}
      MYSQL_USER: ${DB_USERNAME:-unisell}
      MYSQL_PASSWORD: ${DB_PASSWORD:-unisell_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisell

  redis:
    image: redis:7-alpine
    container_name: unisell-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisell

  nginx:
    image: nginx:1.27-alpine
    container_name: unisell-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/api/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - unisell

volumes:
  mysql_data:
  redis_data:

networks:
  unisell:
    driver: bridge
